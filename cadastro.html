<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro na ONG Melhorando Vidas</title>
</head>
<body>
    <section> 
        <form action="Obrigado.html" method="get" id="cadastro">
            <fieldset>
                <legend>Formulário de Dados</legend>
            <h2>Cadastro</h2>
            
            <input type="text" id="CPF" name="CPF" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" title="Digite o CPF no formato: 000.000.000-00" required>
            <br>
            <br>
            <input type="tel" id="telefome" name="telefone" pattern="[0-9]{2}[0-9]{5}[0-9]{4}" placeholder="(00) 00000-0000" title="Digite o telefone com DDD e 9 dígitos, ex: (11) 99999-9999" required>
            <br>
            <br>
            <input type="text" id="CEP" name="CEP" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" title="Digite o CEP no formato: 00000-000" required>
            <br>
            <br>
            <button type="submit">Enviar</button>
            </fieldset>
        </form>
     </section>
</body>
</html>
